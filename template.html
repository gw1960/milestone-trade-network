<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified {{trade}} Specialists in {{suburb}} | Sunshine Coast Corridor</title>
    <style>
        :root { --primary-blue: #0A2540; --safeguard-green: #00D4B2; --text-dark: #1C2434; --bg-light: #F8FAFC; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; color: var(--text-dark); background-color: var(--bg-light); line-height: 1.6; margin: 0; padding: 0; }
        header { background-color: var(--primary-blue); color: #FFF; padding: 20px; text-align: center; font-weight: 700; letter-spacing: 0.5px; }
        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .trust-banner { background: linear-gradient(135deg, var(--primary-blue), #1A365D); color: #FFF; padding: 24px; border-radius: 8px; border-left: 6px solid var(--safeguard-green); margin: 30px 0; }
        .lead-card { background: #FFF; border: 1px solid #E2E8F0; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-top: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .cta-button { display: block; width: 100%; background-color: var(--safeguard-green); color: var(--primary-blue); font-weight: 700; text-align: center; border: none; padding: 16px; border-radius: 6px; font-size: 18px; cursor: pointer; transition: transform 0.1s ease; }
        .cta-button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        🛡️ MILESTONE TRADE NETWORK
    </header>

    <main>
        <!-- AI Script Injects Core Localized Content Here -->
        {{ai_generated_content}}

        <!-- Pre-Paid Lead Allocation Capture Form -->
        <div class="lead-card">
            <h3>Secure Priority Trade Capacity in {{suburb}}</h3>
            <p style="color:#64748B; font-size:14px; margin-bottom:20px;">Submit your project details below. Our routing matrix instantly matches your request with a verified local specialist.</p>
            
            <form action="https://your-n8n-webhook-url.com" method="POST">
                <input type="hidden" name="suburb" value="{{suburb}}">
                <input type="hidden" name="postcode" value="{{postcode}}">
                
                <div class="form-group">
                    <label>Property Owner Name</label>
                    <input type="text" name="customer_name" placeholder="e.g. John Smith" required>
                </div>
                <div class="form-group">
                    <label>Best Contact Mobile Number</label>
                    <input type="tel" name="customer_phone" placeholder="e.g. 0400 000 000" required>
                </div>
                
                <button type="submit" class="cta-button">Check Active Capacity in {{suburb}} →</button>
            </form>
        </div>
    </main>

</body>
</html>
